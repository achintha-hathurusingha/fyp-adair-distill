# LOCKED student architecture — Task 1.5b decision 2026-07-31,
# AMENDED 2026-08-02 after the B0 divergence (findings F9).
#
# NORMALIZATION: N-F+clamp — LayerNorm2d everywhere EXCEPT the full-resolution
# stages (encoder level 0 and its decoder counterpart), which use affine plus a
# hard magnitude clamp at +-8.
#
# WHY THE AMENDMENT. Plain N-F killed B0 at iteration 24356 with a gradient norm
# of 6.5e7. One rare low-variance crop drove the full-resolution DECODER stage
# (`dec3`) to max|a| 5.6e6, because under N-F that stage has no normalisation to
# bound a large-but-finite input. The vulnerability is family-wide: the S arm
# reproduces it too (1129 vs N-A's 2.4 on an adversarial input).
#
# Evidence (reports/norm_quality.md, findings.md F1/F6):
#   Q-A  LayerNorm2d everywhere   31.019 dB   2.513 ms   1.00x
#   Q-F  affine at full-res only  31.014 dB   1.580 ms   1.59x   <- LOCKED
#   Q-E  affine everywhere        DIVERGED    1.072 ms   2.34x
#
# N-F costs 0.005 dB against the reference — twenty times inside the 0.10 dB
# decision threshold — while removing 37% of INT8 latency. N-E was pursued
# through three escalation rungs (half LR, gradient clipping, residual init) and
# diverged in all four variants; its 2.34x is not reachable by tuning
# optimisation (findings F6).
#
# Width and block counts are set per-arm by the S/M/L family
# (reports/family_reselection.md); this file carries the shared, locked pieces.
name: nafnet
img_channels: 3

# --- LOCKED normalization. Do not change without re-running Task 1.5b AND
# --- scripts/stress_test_norm.py against a TRAINED checkpoint. ---
norm_type: layernorm2d          # deeper stages keep full LayerNorm
full_res_norm_type: affine_clamp  # full-resolution: affine + clamp (N-F+clamp)
clamp_bound: 8.0                # see below — measured, not chosen by taste

# Evidence for the clamp and its bound (findings F9), all on the captured
# spike-state weights so the comparison is direct:
#
#   variant                        sample 12    healthy    S24 INT8
#   N-F  (affine)                    705,100      1.048    2.872 ms
#   Fix-B (LayerNorm at full-res)      15.71      11.69    4.728 ms  (1.65x)
#   Fix-C (clamp 8)   <- LOCKED        17.49      1.048    2.881 ms  (1.00x)
#
# The clamp matches full normalisation's containment for +0.3% latency, and is
# INERT on healthy inputs (1.048 unchanged at every bound tested down to 2),
# whereas restoring LayerNorm perturbs them. It is also structurally stronger:
# a clamp bounds unconditionally, where normalisation rescales by measured
# statistics a pathological input could still evade.
#
# Bound 8.0: >2x the healthy maximum observed through that stage, ~5 orders
# below the pathological one. Validated over 50k iterations of live training
# (iteration 20k -> 70k+, through both original divergence points at 24356 and
# 28654) with a pre-committed Mann-Kendall test on 8 intervals showing NO
# significant trend in either pre-clamp magnitude (p=0.71) or engagement rate
# (p=0.27). Engagement is rare and stationary; PSNR improved monotonically.

# Default geometry = the M arm, re-selected on N-F latency
# (reports/family_reselection.md): M = w16_sidd, 7.37M params, 4.13 GMACs,
# 2.873 ms. M moved from w24_b8 once the fixed normalization cost was removed —
# w16_sidd carries the most full-resolution normalization of any config and so
# gained the most from N-F.
width: 16
enc_blk_nums: [2, 2, 4, 8]
middle_blk_num: 12
dec_blk_nums: [2, 2, 2, 2]

# The locked S/M/L family. Full table in reports/family_reselection.md.
family:
  S: {name: w16_b8,   width: 16, enc: [1, 1, 1, 8], middle: 2,  dec: [1, 1, 1, 1]}
  M: {name: w16_sidd, width: 16, enc: [2, 2, 4, 8], middle: 12, dec: [2, 2, 2, 2]}
  L: {name: w24_b28,  width: 24, enc: [1, 1, 1, 28], middle: 1, dec: [1, 1, 1, 1]}

# Channel gate (src/models/gate.py). Export-verified at Gate G1; ops restricted
# to GAP -> 1x1 conv -> ReLU -> 1x1 conv -> sigmoid -> channel-wise multiply.
gate:
  enabled: false
  reduction: 4

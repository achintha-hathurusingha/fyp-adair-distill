# Export + INT8 quantization config for the G1 smoke test.
#
# G1 uses ONNX Runtime static PTQ as the portable smoke-test path (runs on the
# laptop, no device SDK). op_coverage.py additionally reports each ONNX op
# against the QNN / TFLite / TensorRT supported-op lists so we see deploy-target
# risks now. Real on-device QNN export/benchmark happens in Task 5.

export:
  opset: 17
  # Fixed input resolution for the exported graph (N, C, H, W).
  input_shape: [1, 3, 256, 256]
  dynamic_axes: false     # fixed resolution per the protocol

quantization:
  method: static          # static PTQ (calibration-based)
  weight_type: int8
  activation_type: int8
  per_channel: true
  # Number of random calibration samples for the smoke test (real calibration
  # data wired in Task 2 once the dataloader exists).
  calib_samples: 32
  calib_source: random    # 'random' for G1 smoke test; 'dataset' later

target_backends:          # for op_coverage static reporting
  - qnn
  - tflite
  - tensorrt

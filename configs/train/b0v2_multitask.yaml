# B0-v2 — the ALL-IN-ONE baseline. This is the one the protocol asks for.
#
# SCOPE. Three degradations in one model, per AirNet/PromptIR/AdaIR: denoising
# at sigma in {15,25,50}, deraining (Rain100L), dehazing (RESIDE-OTS). Every
# batch holds an equal share of all three (src/data/sampler.py). Contrast with
# b0_baseline.yaml — B0-denoise — which trains on denoise alone and is retained
# as a single-task control, not as this baseline (findings F11).
#
# No teacher involvement of any kind. Reconstruction loss on ground truth only.
# If this file ever grows a distillation term, it stops being a baseline.
#
# Architecture is the same locked M arm as B0-denoise, unchanged, so the two are
# directly comparable and every INT8 latency measured so far still applies:
#   norm    N-F  — LayerNorm2d deeper, affine_clamp at full resolution (F9)
#   M arm   w16_sidd, 7.37M params, 4.13 GMACs, 2.885 ms INT8 on S24
#
# STATUS: NOT LAUNCHED. Blocked on the RESIDE-OTS download (~4.6 GB; see
# scripts/reside_manifest.py) and on B5 validation of the loader on
# denoise+derain. Launch is staged — seed 0 alone, watched through an early
# checkpoint, seeds 1/2 only after it clears.

experiment: b0v2_multitask
model: configs/model/nafnet_locked.yaml

arch:
  width: 16
  enc_blk_nums: [2, 2, 4, 8]
  middle_blk_num: 12
  dec_blk_nums: [2, 2, 2, 2]
  norm_type: layernorm2d
  full_res_norm_type: affine_clamp   # F9: plain affine here killed B0
  clamp_bound: 8.0                   # active from iteration 0, not retrofitted

  # Deep-stage clamp insurance. enc3 is 8 blocks at 128 channels and is where a
  # low-noise input gets amplified (F10). Measured on the trained B0-denoise
  # weights over BSD68, max |enc3 norm output| is 4.7-4.8 at the trained sigmas
  # but 11.2 at sigma 0 and 5 -- 2.4x higher on inputs the model never saw,
  # which is F10 visible at the activation level. A bound of 32 sits 2.9x above
  # even that worst case, so it is inert in every state observed so far.
  #
  # CAVEAT, stated because it would otherwise be assumed away: LayerNorm already
  # bounds its own output structurally, which is why enc3 reached only 7.59
  # during the F9 divergence while the unnormalised dec3 reached 5.6e6. The
  # expected benefit here is therefore small; it ships for the F9 reason, that a
  # clamp bounds unconditionally and distribution coverage does not.
  #
  # LATENCY: this changes the exported graph. The 2.885 ms measured for the
  # locked M arm describes a model WITHOUT it. Re-profile on AI Hub before
  # quoting any INT8 number for B0-v2.
  enc_clamp_stages: [3]
  deep_clamp_bound: 32.0

data:
  patch_size: 128
  batch_size: 16          # MICRO-batch, effective 32 via accum_steps (F8).
                          # 16 = 3 tasks x 5 + 1 rotating extra; see sampler.py
                          # for how the leftover slot is shared out fairly.
  # Noise levels. `sigmas` is the protocol's discrete set and is what the
  # EVALUATION harness uses; training samples continuously instead.
  sigmas: [15, 25, 50]

  # F10 FIX. B0-denoise saw only {15, 25, 50} and had no coverage whatsoever
  # below 15. Given a nearly-clean input it applied the denoising it had always
  # been rewarded for and destroyed the image — 125.37/255 mean absolute error
  # against AdaIR's 1.88/255. Continuous sampling closes the gap in coverage.
  #
  # Upper bound 55, slightly above the protocol's 50, so sigma=50 sits inside
  # the sampled interval rather than on its edge.
  sigma_range: [0.0, 55.0]
  # Uniform sampling gives exactly-clean input measure zero, and clean input is
  # the worst case F10 actually exhibited. 5% of denoise samples are the exact
  # identity task, anchoring the mapping at the end of the range that broke.
  clean_prob: 0.05

  mixed_task: true        # LOAD-BEARING since F11 — selects the balanced loader
  # Task roots, relative to data_root. Mandatory when mixed_task is true; there
  # is no default, because defaulting to denoise is precisely how B0-denoise
  # came to be mislabelled. Denoise points at a directory of clean images;
  # derain/dehaze either at a directory holding input/ and target/, or at an
  # explicit input/target pair for a dataset published in another layout.
  tasks:
    denoise: Train/Denoise    # 5,144 images (BSD400 + WED)
    derain:  Train/Derain     # 200 pairs (Rain100L), repeats to fill its share
    # RESIDE-OTS ships synthetic/part1..4 beside clear/ and has no input/ dir.
    # Named outright rather than reshaping 72,135 files to fit a convention —
    # the layout below is the one hazy_outside.txt refers to, so our copy stays
    # checkable against the vendored list. VERIFIED 2026-08-03: 72,135 hazy,
    # 2,061 clear, 11.17 GB (scripts/reside_manifest.py verify).
    dehaze:
      input:  Train/Dehaze/synthetic
      target: Train/Dehaze/clear

  num_workers: 6
  # PER WORKER decoded-image cache; resident total is num_workers x this.
  # Unchanged from B0-denoise, but note the mix now includes RESIDE-OTS JPEGs,
  # which decode larger than BSD400 — watch RSS on the first staged run.
  cache_budget_gb: 0.75

optim:
  name: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  betas: [0.9, 0.9]
  grad_clip: 1.0          # as retried on B0-denoise after the F9 divergence

schedule:
  name: cosine
  total_iters: 300000
  warmup_iters: 5000
  min_lr: 1.0e-6

train:
  accum_steps: 2
  ema_decay: 0.999
  amp: true               # bfloat16
  val_every: 5000
  ckpt_every: 5000
  seeds: [0, 1, 2]

  # F12 WATCH ITEM. Clamp engagement rate rose significantly on all three
  # B0-denoise seeds (Mann-Kendall p<0.001 each), ending at 0.06/2.35/1.67%
  # against a bound of 8.0. On this run both clamps are instrumented from
  # iteration 0 and reported separately: `clampeng`/`premax` for dec3 at full
  # resolution, `deepeng`/`deeppremax` for the enc3 insurance.
  #
  # STOP AND RE-RUN THE AGC DIAGNOSTIC if dec3 engagement passes ~5%, or if
  # enc3 engages at all — it is expected to stay at exactly 0.00%.
  #
  # This was an uncommitted edit to norms.py for the whole of B0-denoise. A
  # fresh checkout would have logged nothing, and F12 would have been
  # unobservable on the run it was written to inform.
  track_clamp_engagement: true

loss:
  name: charbonnier       # reconstruction ONLY — Phase 01 admits nothing else
  eps: 1.0e-3

eval:
  harness: src/eval/evaluate.py
  # BUG FOUND (kd_feature_multitask plan.md section 4): this block used to
  # be just `test_sets: [bsd68]`, which documents nothing and overrides
  # nothing -- Trainer.val_task defaulted to "denoise" and the completed
  # B0V2 baseline (300k iters, runs/b0v2/B0V2/B0V2_seed0_20260803_210918)
  # validated on denoise only, with NO dehaze/derain numbers at all despite
  # training on all three. val_tasks (plural, per-task roots) is what
  # Trainer/train.py actually read -- see src/train/trainer.py
  # Trainer._validate_multitask.
  val_tasks:
    denoise: test/denoise/bsd68
    derain:  test/derain/demo
    dehaze:  test/dehaze/demo
  test_sets: [bsd68, derain_demo, dehaze_demo]   # documentation only

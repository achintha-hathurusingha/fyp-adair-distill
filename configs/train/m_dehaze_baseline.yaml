# M-DEHAZE — single-task dehazing baseline for the teacher-gap demo.
#
# SCOPE, stated first because this is a demo and not a Phase 02 result:
#   * dehaze ONLY, on a seeded 4,000-image subset of RESIDE-OTS's 72,135
#   * ONE seed, not the 3-seed discipline B0-denoise and B0-v2 used
#   * short schedule chosen for a deadline, not for convergence
# It exists to measure the AdaIR-to-NAFNet gap on one task and to test whether
# response distillation narrows it. It is not a baseline anything else should be
# compared against.
#
# Architecture is the locked M arm, byte-identical to B0-v2 — same width, same
# blocks, same normalization, same clamps — so the GT-only and GT+KD runs differ
# in exactly one thing: the loss. See configs/model/nafnet_locked.yaml.
#
# No teacher involvement in THIS config. The distillation variant is
# m_dehaze_kd.yaml and adds one loss term, nothing else.

experiment: m_dehaze_baseline
model: configs/model/nafnet_locked.yaml

arch:
  width: 16
  enc_blk_nums: [2, 2, 4, 8]
  middle_blk_num: 12
  dec_blk_nums: [2, 2, 2, 2]
  norm_type: layernorm2d
  full_res_norm_type: affine_clamp
  clamp_bound: 8.0
  enc_clamp_stages: [3]
  deep_clamp_bound: 32.0

data:
  patch_size: 128
  batch_size: 16
  sigmas: [15, 25, 50]      # unused on this task; kept so the arch/config
                            # comparison against B0-v2 stays key-for-key
  mixed_task: true          # one task in the mix — the multi-task loader with a
                            # single source, NOT a separate code path
  tasks:
    # Seeded subset, written by scripts/make_dehaze_split.py and committed. The
    # held-out evaluation set is disjoint BY CLEAR SOURCE STEM: OTS renders ~35
    # hazy variants per clear image, so splitting on hazy filenames would put
    # the same scene on both sides and the held-out score would measure
    # memorisation.
    dehaze:
      input:  Train/Dehaze/synthetic
      target: Train/Dehaze/clear
      list:   reports/dehaze_train_list.txt
  num_workers: 8
  cache_budget_gb: 0.75

optim:
  name: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  betas: [0.9, 0.9]
  grad_clip: 1.0

schedule:
  name: cosine
  # 60k, not the 300k of B0-v2: a single task on 4,000 images, and the demo has
  # a deadline. Convergence is judged from the validation curve flattening and
  # REPORTED, not asserted by having picked a number in advance.
  total_iters: 60000
  warmup_iters: 2000
  min_lr: 1.0e-6

train:
  accum_steps: 2
  ema_decay: 0.999
  amp: true
  val_every: 2000           # denser than B0's 5000: the curve IS the
                            # convergence evidence, so it needs resolution
  ckpt_every: 2000
  seeds: [0]
  track_clamp_engagement: true

loss:
  name: charbonnier
  eps: 1.0e-3

eval:
  harness: src/eval/evaluate.py
  # Validating a dehazing model on BSD68 would measure nothing it trains for.
  val_task: dehaze
  val_root: test/dehaze/demo
  test_sets: [dehaze_demo_heldout]

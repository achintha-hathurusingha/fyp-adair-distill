# S3.3 no-block control, CACHED teacher (pairs with S33-K11-CACHED)
# Generated from configs/train/b0v3_kd_feat.yaml; identical except the cached-teacher switch.
# MUST be compared only against the other CACHED arm -- the cache costs
# ~0.12 dB vs a live teacher, which cancels only within a cached pair.
# B0V3-KD-FEAT -- Student v3 architecture + response+feature KD.
#
# WHY THIS ARM EXISTS. The current comparison is confounded:
#
#   B0V2-KD-FEAT = NAFNet     + KD       -> 33.621
#   B0V3         = StudentV3  + GT-only  -> 33.520
#
# Those differ in TWO variables (architecture AND training regime), so the
# 0.101dB gap cannot be attributed to either. This arm holds the training
# regime fixed and changes only the architecture:
#
#   B0V3-KD-FEAT = StudentV3  + KD       -> vs B0V2-KD-FEAT is a PURE
#                                           architecture comparison.
#
# Every distillation field below is copied verbatim from
# configs/train/b0v2_kd_feat.yaml -- same teacher, same weights, deliberately
# NOT re-tuned, so any difference traces to the architecture alone and not to
# a re-picked hyperparameter.
#
# Feature-KD compatibility was verified before writing this: the trainer hooks
# model.middle_blks, and StudentV3 keeps its global-context operators INSIDE
# that Sequential precisely so the hook still sees the whole bottleneck. The
# hook was confirmed to fire with the correct 256 channels.

experiment: b0v3_kd_feat
model: configs/model/nafnet_locked.yaml

arch:
  arch: student_v3
  width: 16
  enc_blk_nums: [2, 2, 4, 8]
  middle_blk_num: 12
  dec_blk_nums: [2, 2, 2, 2]
  norm_type: layernorm2d
  full_res_norm_type: affine_clamp
  clamp_bound: 8.0
  enc_clamp_stages: [3]
  deep_clamp_bound: 32.0
  use_dcp_prior: true
  use_strip_pool: true
  use_oriented_streak: true

data:
  patch_size: 128
  batch_size: 16
  sigmas: [15, 25, 50]
  mixed_task: true
  tasks:
    denoise: Train/Denoise
    derain:  Train/Derain
    dehaze:
      input:  Train/Dehaze/synthetic
      target: Train/Dehaze/clear
  num_workers: 6
  cache_budget_gb: 0.75

optim:
  name: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  betas: [0.9, 0.9]
  grad_clip: 1.0

schedule:
  name: cosine
  total_iters: 90000        # matched to B0V2-KD-FEAT and B0V3
  warmup_iters: 3000
  min_lr: 1.0e-6

train:
  accum_steps: 2
  ema_decay: 0.999
  amp: true
  val_every: 3000
  ckpt_every: 3000
  seeds: [0]
  track_clamp_engagement: true

loss:
  name: charbonnier
  eps: 1.0e-3

distill:
  use_cached_teacher: true
  cache_dir: cache/teacher_cache_v2
  weight: 1.0
  feat_weight: 0.01

eval:
  harness: src/eval/evaluate.py
  val_tasks:
    # Leak-free sets. The former test/{derain,dehaze}/demo sets were carved out
    # of the TRAINING corpora and multi-task runs never excluded them -- see
    # scripts/fix_val_tasks.py. Training data is unchanged and still matches the
    # published protocol (BSD400+WED / Rain100L-200 / OTS-72135).
    denoise: test/denoise/bsd68      # 68 imgs; verified disjoint from BSD400+WED
    derain:  test/derain/rain100L    # Rain100L TEST, 100 pairs; 0/200 content overlap
    dehaze:  test/dehaze/sots_clean  # SOTS-outdoor minus the 75 scenes RESIDE leaks into OTS
  test_sets: [bsd68, rain100L, sots_clean]

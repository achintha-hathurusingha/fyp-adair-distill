<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kd_feature_multitask dashboard</title>
<style>
  :root {
    --bg: #0f1420; --panel: #161d2e; --panel2: #1c2438; --border: #2a3348;
    --text: #e6e9f0; --muted: #8a93a8; --accent: #4f8cff;
    --control: #6b7fd7; --treat: #e0a44a; --cached: #33b0c1;
    --good: #33c17a; --warn: #e0b83f; --bad: #e0554a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
  }
  header {
    padding: 18px 28px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; justify-content: space-between;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12.5px; }
  #hosts { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
  .host-pill { padding: 3px 9px; border-radius: 20px; border: 1px solid var(--border); }
  .host-pill.up { color: var(--good); border-color: var(--good); }
  .host-pill.down { color: var(--bad); border-color: var(--bad); }

  main { padding: 20px 28px; max-width: 1500px; margin: 0 auto; }

  #compare {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 20px; margin-bottom: 20px;
  }
  #compare h2 { margin: 0 0 12px; font-size: 13px; color: var(--muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em; }
  .delta-row { display: grid; grid-template-columns: 100px 1fr 70px; gap: 12px; align-items: center; margin-bottom: 8px; }
  .delta-row .label { color: var(--muted); font-size: 12.5px; }
  .delta-bar-track { height: 18px; background: #0c1120; border-radius: 4px; position: relative; overflow: hidden; }
  .delta-bar { position: absolute; top: 0; bottom: 0; background: var(--accent); }
  .delta-bar.neg { background: var(--bad); }
  .delta-val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .delta-val.pos { color: var(--good); }
  .delta-val.neg { color: var(--bad); }
  #compare .note { color: var(--muted); font-size: 11.5px; margin-top: 6px; }

  #gpus { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 20px; }
  @media (max-width: 980px) { #gpus { grid-template-columns: 1fr; } }
  .gpu-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 18px;
  }
  .gpu-card .gpu-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .gpu-card .gpu-host { font-weight: 700; font-size: 13.5px; }
  .gpu-card .gpu-name { color: var(--muted); font-size: 11px; }
  .gpu-card .gpu-free-badge {
    font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 20px;
  }
  .gpu-free-badge.roomy { background: rgba(51,193,122,0.15); color: var(--good); }
  .gpu-free-badge.tight { background: rgba(224,184,63,0.15); color: var(--warn); }
  .gpu-free-badge.full  { background: rgba(224,85,74,0.15); color: var(--bad); }
  .vram-track {
    height: 22px; background: #0c1120; border-radius: 5px; overflow: hidden;
    position: relative; margin-bottom: 6px;
  }
  .vram-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #6ea8ff); }
  .vram-label {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-variant-numeric: tabular-nums; font-weight: 600;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  .gpu-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 11.5px; }
  .gpu-meta b { color: var(--text); font-variant-numeric: tabular-nums; }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 980px) { .cards { grid-template-columns: 1fr; } }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden;
  }
  .card.control { border-top: 3px solid var(--control); }
  .card.treat { border-top: 3px solid var(--treat); }
  .card.cached { border-top: 3px solid var(--cached); }
  .card-head { padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
  .card-head .name { font-weight: 700; font-size: 14.5px; }
  .card-head .role { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .status-pill { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600; }
  .status-pill.live { background: rgba(51,193,122,0.15); color: var(--good); }
  .status-pill.stale { background: rgba(224,184,63,0.15); color: var(--warn); }
  .status-pill.err { background: rgba(224,85,74,0.15); color: var(--bad); }
  .status-pill.complete { background: rgba(107,127,215,0.18); color: var(--control); }
  .status-pill.stopped { background: rgba(224,85,74,0.15); color: var(--bad); }

  #throughput {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 20px; margin-bottom: 20px;
  }
  #throughput h2 { margin: 0 0 12px; font-size: 13px; color: var(--muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em; }
  .tp-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .tp-stat { text-align: center; }
  .tp-stat .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tp-stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
  .tp-arrow { font-size: 20px; color: var(--muted); }
  .tp-speedup { margin-left: auto; text-align: right; }
  .tp-speedup .v { font-size: 28px; font-weight: 800; color: var(--good); }
  .tp-speedup .k { font-size: 11px; color: var(--muted); text-transform: uppercase; }

  .progress-wrap { padding: 0 18px 14px; }
  .progress-track { height: 6px; background: #0c1120; border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); }
  .progress-label { display: flex; justify-content: space-between; color: var(--muted); font-size: 11.5px; margin-top: 5px; }

  .metrics-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); }
  .metric { background: var(--panel2); padding: 10px 14px; }
  .metric .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .metric .k { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }

  .task-psnr { padding: 14px 18px; display: flex; gap: 10px; }
  .task-chip { flex: 1; background: var(--panel2); border-radius: 8px; padding: 8px 10px; text-align: center; }
  .task-chip .tname { font-size: 10.5px; color: var(--muted); text-transform: uppercase; }
  .task-chip .tval { font-size: 16px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }

  .diag-row { padding: 4px 18px 14px; display: flex; gap: 16px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
  .diag-row b { color: var(--text); font-variant-numeric: tabular-nums; }
  .diag-row b.warn { color: var(--warn); }

  .log { background: #0a0e18; border-top: 1px solid var(--border); padding: 10px 18px;
    font-family: "Cascadia Code", Consolas, monospace; font-size: 11px; color: #9fb0c9;
    max-height: 150px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }

  .empty { padding: 30px 18px; text-align: center; color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>kd_feature_multitask</h1>
    <div class="sub">control (complete) · treatment v1 (stopped, regressed) · cached-teacher speed variant (active)</div>
  </div>
  <div id="hosts"></div>
</header>
<main>
  <div id="gpus"></div>
  <div id="throughput"></div>
  <div id="compare"></div>
  <div class="cards" id="cards"></div>
</main>

<script>
const TOTAL_ITERS = 90000;
const ARM_META = {
  "B0V2-KD-FEAT": {role: "control · complete", css: "control", label: "B0V2-KD-FEAT",
    forceStatus: "complete"},
  "B0V2-KD-FEAT-COND": {role: "treatment v1 · stopped, regressed", css: "treat",
    label: "B0V2-KD-FEAT-COND", forceStatus: "stopped"},
  "B0V2-KD-FEAT-CACHED": {role: "speed variant · active", css: "cached",
    label: "B0V2-KD-FEAT-CACHED"},
};
const TASKS = ["denoise", "derain", "dehaze"];

function fmt(v, d=3) { return (v === undefined || v === null || Number.isNaN(v)) ? "—" : v.toFixed(d); }
function esc(s) { return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function findArm(hosts, armName) {
  for (const h of Object.values(hosts)) {
    if (!h.arms) continue;
    const found = h.arms.find(a => a.arm === armName);
    if (found) return found;
  }
  return null;
}

function renderGpus(hosts) {
  const el = document.getElementById("gpus");
  const order = ["devon", "qbits"];
  el.innerHTML = order.map(name => {
    const h = hosts[name];
    if (!h) return "";
    if (h.error) {
      return `<div class="gpu-card"><div class="gpu-head"><span class="gpu-host">${name}</span>
        <span class="gpu-free-badge full">unreachable</span></div>
        <div style="color:var(--muted);font-size:12px">${esc(h.error)}</div></div>`;
    }
    const gpus = h.gpus || [];
    if (!gpus.length || gpus[0].error) {
      return `<div class="gpu-card"><div class="gpu-head"><span class="gpu-host">${name}</span>
        <span class="gpu-free-badge full">no gpu data</span></div>
        <div style="color:var(--muted);font-size:12px">${esc((gpus[0]||{}).error || "nvidia-smi unavailable")}</div></div>`;
    }
    return gpus.map(g => {
      const usedPct = g.mem_used_mb / g.mem_total_mb * 100;
      const freeGb = g.mem_free_mb / 1024;
      const totalGb = g.mem_total_mb / 1024;
      const badgeClass = freeGb > 8 ? "roomy" : freeGb > 3 ? "tight" : "full";
      const nArms = (h.arms || []).length;
      const workloadNote = nArms === 0
        ? `<span style="color:var(--good)">idle — no arms tracked here</span>`
        : `${nArms} arm${nArms>1?'s':''} running`;
      return `<div class="gpu-card">
        <div class="gpu-head">
          <div><span class="gpu-host">${name}</span> <span class="gpu-name">${esc(g.name)} · ${g.temp_c}°C</span></div>
          <span class="gpu-free-badge ${badgeClass}">${freeGb.toFixed(1)} GB free</span>
        </div>
        <div class="vram-track">
          <div class="vram-fill" style="width:${usedPct}%"></div>
          <div class="vram-label">${(g.mem_used_mb/1024).toFixed(1)} / ${totalGb.toFixed(1)} GB (${usedPct.toFixed(0)}%)</div>
        </div>
        <div class="gpu-meta"><span>util <b>${g.util_pct}%</b></span><span>${workloadNote}</span></div>
      </div>`;
    }).join("");
  }).join("");
}

function renderThroughput(hosts) {
  const el = document.getElementById("throughput");
  const control = findArm(hosts, "B0V2-KD-FEAT");
  const cached = findArm(hosts, "B0V2-KD-FEAT-CACHED");
  const cL = control && control.latest, kL = cached && cached.latest;
  if (!cL || !cL.elapsed_s || !kL || !kL.elapsed_s) {
    el.innerHTML = `<h2>Throughput — live vs cached teacher</h2>
      <div class="empty">Waiting for both arms to have at least one checkpoint with timing data...</div>`;
    return;
  }
  const controlRate = cL.iteration / cL.elapsed_s;
  const cachedRate = kL.iteration / kL.elapsed_s;
  const speedup = cachedRate / controlRate;
  el.innerHTML = `<h2>Throughput — live-teacher control vs cached-teacher speed variant</h2>
    <div class="tp-row">
      <div class="tp-stat"><div class="v">${controlRate.toFixed(3)}</div><div class="k">control it/s (live teacher)</div></div>
      <div class="tp-arrow">&rarr;</div>
      <div class="tp-stat"><div class="v">${cachedRate.toFixed(3)}</div><div class="k">cached it/s</div></div>
      <div class="tp-speedup"><div class="v">${speedup.toFixed(2)}&times;</div><div class="k">speedup so far</div></div>
    </div>
    <div class="note" style="margin-top:8px">profile_step_cost.py predicted ~4-5x from eliminating the live teacher forward (~78% of a step). Control rate is its full-run average (90k iters); cached rate is from ${kL.iteration.toLocaleString()} iterations so far.</div>`;
}

function renderCompare(hosts) {
  const el = document.getElementById("compare");
  const control = findArm(hosts, "B0V2-KD-FEAT");
  const treat = findArm(hosts, "B0V2-KD-FEAT-COND");
  const cL = control && control.latest, tL = treat && treat.latest;
  if (!cL || !tL || cL.psnr === undefined || tL.psnr === undefined) {
    el.innerHTML = `<h2>Control vs Treatment</h2><div class="empty">Waiting for both arms to report a checkpoint (val_every=3000 iters)...</div>`;
    return;
  }
  let rows = "";
  const allTasks = [["combined", "psnr"], ...TASKS.map(t => [t, `psnr_${t}`])];
  let maxAbs = 0.3;
  for (const [, key] of allTasks) {
    const d = (tL[key] ?? 0) - (cL[key] ?? 0);
    maxAbs = Math.max(maxAbs, Math.abs(d));
  }
  for (const [label, key] of allTasks) {
    const cv = cL[key], tv = tL[key];
    if (cv === undefined || tv === undefined) continue;
    const d = tv - cv;
    const pct = Math.min(100, Math.abs(d) / maxAbs * 50);
    const isNeg = d < 0;
    rows += `<div class="delta-row">
      <div class="label">${label}</div>
      <div class="delta-bar-track">
        <div class="delta-bar ${isNeg?'neg':''}" style="left:${isNeg?50-pct:50}%;width:${pct}%"></div>
        <div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--border)"></div>
      </div>
      <div class="delta-val ${d>=0?'pos':'neg'}">${d>=0?'+':''}${fmt(d)}</div>
    </div>`;
  }
  el.innerHTML = `<h2>Control vs Treatment v1 (STOPPED, regressed) — PSNR delta, dB</h2>${rows}
    <div class="note">Historical record, not an active comparison — v1 (FiLM on middle_blks) was stopped at it 69,000 after regressing every task (reports/kd_feature_multitask/cond_regression.md). iteration ${control.latest.iteration} (control) / ${treat.latest.iteration} (treatment v1)</div>`;
}

function renderCard(armName, armStatus) {
  const meta = ARM_META[armName];
  if (!armStatus || armStatus.error) {
    return `<div class="card ${meta.css}">
      <div class="card-head"><div><div class="name">${meta.label}</div><div class="role">${meta.role}</div></div>
      <span class="status-pill err">no data</span></div>
      <div class="empty">${esc(armStatus ? armStatus.error : "not reporting")}</div></div>`;
  }
  const L = armStatus.latest || {};
  const it = L.iteration || 0;
  const pct = Math.min(100, it / TOTAL_ITERS * 100);
  const statusClass = meta.forceStatus || (armStatus.stale ? "stale" : "live");
  const statusText = meta.forceStatus || (armStatus.stale ? "stale" : "live");

  const taskChips = TASKS.map(t => `<div class="task-chip">
      <div class="tname">${t}</div>
      <div class="tval">${fmt(L["psnr_"+t], 2)}</div>
    </div>`).join("");

  const clampWarn = (L.clamp_engage_rate||0) > 0.05 || (L.deep_clamp_engage_rate||0) > 0;
  const auxLine = L.aux_last !== undefined ? `aux <b>${fmt(L.aux_last)}</b> · ` : "";

  return `<div class="card ${meta.css}">
    <div class="card-head">
      <div><div class="name">${meta.label}</div><div class="role">${meta.role}</div></div>
      <span class="status-pill ${statusClass}">${statusText}</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-label"><span>iter ${it.toLocaleString()} / ${TOTAL_ITERS.toLocaleString()}</span><span>${pct.toFixed(1)}%</span></div>
    </div>
    <div class="metrics-row">
      <div class="metric"><div class="v">${fmt(L.psnr, 2)}</div><div class="k">psnr (mean)</div></div>
      <div class="metric"><div class="v">${fmt(L.loss)}</div><div class="k">loss</div></div>
      <div class="metric"><div class="v">${fmt(L.grad_norm)}</div><div class="k">grad norm</div></div>
      <div class="metric"><div class="v">${fmt((L.clip_rate||0)*100,1)}%</div><div class="k">clip rate</div></div>
    </div>
    <div class="task-psnr">${taskChips}</div>
    <div class="diag-row">
      <span>clamp <b class="${clampWarn?'warn':''}">${fmt((L.clamp_engage_rate||0)*100,2)}%</b></span>
      <span>deep clamp <b class="${clampWarn?'warn':''}">${fmt((L.deep_clamp_engage_rate||0)*100,2)}%</b></span>
      <span>feat <b>${fmt(L.feat_last)}</b></span>
      <span>${auxLine}vram <b>${fmt(L.peak_vram_gb,2)}GB</b></span>
    </div>
    <div class="log">${esc((armStatus.log_tail||[]).join("\n")) || "(no log yet)"}</div>
  </div>`;
}

async function tick() {
  let data;
  try {
    const res = await fetch("/api/status");
    data = await res.json();
  } catch (e) { return; }

  const hosts = data.hosts || {};
  const hostsEl = document.getElementById("hosts");
  hostsEl.innerHTML = Object.entries(hosts).map(([name, h]) => {
    const up = !h.error;
    return `<span class="host-pill ${up?'up':'down'}">${name} ${up?'●':'✕'}</span>`;
  }).join("");

  renderGpus(hosts);
  renderThroughput(hosts);
  renderCompare(hosts);

  const cardsEl = document.getElementById("cards");
  const order = ["B0V2-KD-FEAT", "B0V2-KD-FEAT-COND", "B0V2-KD-FEAT-CACHED"];
  cardsEl.innerHTML = order.map(arm => renderCard(arm, findArm(hosts, arm))).join("");
}

tick();
setInterval(tick, 6000);
</script>
</body>
</html>
